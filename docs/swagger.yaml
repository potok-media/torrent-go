  /api/torrents/{hash}/files/{fileIndex}/subtitle-file:
    get:
      description: Reads a WHOLE sidecar subtitle file (a separate file in the torrent,
        "ext" releases) by its 1-based torrent index and converts SRT to WebVTT (ASS/SSA/VTT
        pass through unchanged). Unlike /subtitles/{trackIndex}, no embedded-track
        demux is involved; `?start=` is ignored (sub files are tiny, the player's
        windowed feeder dedupes cues).
      operationId: getExternalSubtitleFile
      parameters:
      - description: Infohash (40-char hex)
        in: path
        name: hash
        required: true
        type: string
      - description: Torrent index of the subtitle file itself (1-based)
        in: path
        name: fileIndex
        required: true
        type: integer
      produces:
      - text/plain
      responses:
        "200":
          description: Subtitle body (text/vtt, text/x-ssa or text/plain)
          schema:
            type: string
        "500":
          description: subtitle file unavailable / read failed
          schema:
            type: string
      security: []
      summary: Serve an external (sidecar) subtitle file
      tags:
      - Media
  /api/torrents/{hash}/files/{fileIndex}/subtitles/{trackIndex}:
    get:
      description: 'Demuxes an embedded text subtitle track (0-based trackIndex =
        subtitle relIndex from /metadata) and serves it as WebVTT (default), ASS/SSA
        or SRT depending on `format`. With `start` the extraction is windowed around
        the playhead; a window whose pieces are not downloaded yet returns 202 + `Retry-After:
        2` and the client retries as playback nears. Responses carry a content ETag
        — conditional re-requests get 304. Also mounted at the legacy path /stream/{hash}/{fileIndex}/subtitles/{trackIndex}.'
      parameters:
      - description: Infohash (40-char hex)
        in: path
        name: hash
        required: true
        type: string
      - description: File index in the torrent (1-based)
        in: path
        name: fileIndex
        required: true
        type: integer
      - description: Subtitle track index (0-based, per-file subtitle relIndex)
        in: path
        name: trackIndex
        required: true
        type: integer
      - description: 'Output format: webvtt (default) | ass | srt'
        in: query
        name: format
        type: string
      - description: Playhead seconds — extract only the windowed time-slice around
          it
        in: query
        name: start
        type: number
      produces:
      - text/plain
      responses:
        "200":
          description: Subtitle body (text/vtt, text/x-ssa or text/srt)
          schema:
            type: string
        "202":
          description: Window not downloaded yet — retry after Retry-After seconds
          headers:
            Retry-After:
              description: Seconds to wait before retrying
              type: integer
          schema:
            type: string
        "304":
          description: Not modified (matching ETag)
          schema:
            type: string
        "500":
          description: subtitle extraction failed
          schema:
            type: string
      security: []
      summary: Extract an embedded subtitle track
      tags:
      - Media
  /api/torrents/{hash}/files/{fileIndex}/thumbnail:
    get:
      description: Seeks in-process to `time` (rounded to a 5-second bucket) and returns
        a 160x90 JPEG. Results are LRU-cached; concurrent requests for the same bucket
        are coalesced.
      operationId: getThumbnail
      parameters:
      - description: Infohash (40-char hex)
        in: path
        name: hash
        required: true
        type: string
      - description: File index in the torrent (1-based)
        in: path
        name: fileIndex
        required: true
        type: integer
      - description: Timestamp in seconds (rounded to the nearest 5s)
        in: query
        name: time
        type: number
      produces:
      - image/jpeg
      responses:
        "200":
          description: JPEG image (160x90)
          schema:
            type: string
        "400":
          description: invalid hash or file index
          schema:
            type: string
        "404":
          description: torrent not active
          schema:
            type: string
        "500":
          description: thumbnail extraction failed
          schema:
            type: string
      security: []
      summary: Extract a JPEG thumbnail at a timestamp
      tags:
      - Media
  /docs:
    get:
      description: Serves the Scalar API-reference page rendering /openapi.yaml.
      operationId: getApiDocs
      produces:
      - text/html
      responses:
        "200":
          description: Scalar HTML page
          schema:
            type: string
      security: []
      summary: Interactive API documentation (Scalar UI)
      tags:
      - System
  /health:
    get:
      description: Liveness probe; always 200 with the plain-text body "OK".
      operationId: healthCheck
      produces:
      - text/plain
      responses:
        "200":
          description: OK
          schema:
            type: string
      security: []
      summary: Health check
      tags:
      - System
  /openapi.yaml:
    get:
      description: Serves the generated OpenAPI (Swagger 2.0) YAML embedded in the
        binary.
      operationId: getOpenAPISpec
      produces:
      - application/yaml
      responses:
        "200":
          description: OpenAPI YAML
          schema:
            type: string
      security: []
      summary: OpenAPI specification
      tags:
      - System
